type: object
properties:
  _id:
    type: string
    example: "507f1f77bcf86cd799439011"
  name:
    type: string
    example: "Alice Johnson"
  phoneNumber:
    type: string
    example: "+380501234567"
  email:
    type: string
    format: email
    example: "alice@example.com"
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    enum: [work, home, personal]
    example: "personal"
  photo:
    type: string
    nullable: true
    example: "https://res.cloudinary.com/.../photo.jpg"
  userId:
    type: string
    example: "507f1f77bcf86cd799439012"
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
required:
  - name
  - phoneNumber
  - contactType
  - userId