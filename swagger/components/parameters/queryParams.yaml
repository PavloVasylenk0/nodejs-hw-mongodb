page:
  name: page
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    default: 1
  description: Page number for pagination

perPage:
  name: perPage
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 10
  description: Number of items per page

sortBy:
  name: sortBy
  in: query
  required: false
  schema:
    type: string
    enum: [name, phoneNumber, email, contactType, isFavourite, createdAt]
    default: name
  description: Field to sort by

sortOrder:
  name: sortOrder
  in: query
  required: false
  schema:
    type: string
    enum: [asc, desc]
    default: asc
  description: Sort order

type:
  name: type
  in: query
  required: false
  schema:
    type: string
    enum: [work, home, personal]
  description: Filter by contact type

isFavourite:
  name: isFavourite
  in: query
  required: false
  schema:
    type: boolean
  description: Filter by favourite status
