tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact with optional photo upload.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: "John Doe"
          phoneNumber:
            type: string
            example: "+380501234567"
          email:
            type: string
            format: email
            example: "john@example.com"
          isFavourite:
            type: boolean
            example: false
          contactType:
            type: string
            enum: [work, home, personal]
            example: "personal"
          photo:
            type: string
            format: binary
            description: Contact photo (optional)
        required:
          - name
          - phoneNumber
          - contactType
responses:
  '201':
    description: Successfully created contact
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: "Successfully created a contact!"
            data:
              $ref: '../../components/schemas/Contact.yaml'
  '400':
    $ref: '../../components/responses/ValidationError.yaml'
  '401':
    $ref: '../../components/responses/UnauthorizedError.yaml'
  '500':
    $ref: '../../components/responses/ServerError.yaml'