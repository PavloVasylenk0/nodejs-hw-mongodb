tags:
  - Contacts
summary: Get contact by ID
operationId: getContactById
description: Retrieve a specific contact by its ID. The user can only access their own contacts.
security:
  - bearerAuth: []
parameters:
  - $ref: '../../../components/parameters/contactId.yaml'
responses:
  '200':
    description: Successfully retrieved contact
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: "Successfully found contact with id 507f1f77bcf86cd799439011!"
            data:
              $ref: '../../../components/schemas/Contact.yaml'
  '400':
    description: Invalid contact ID format
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Error.yaml'
        example:
          status: 400
          message: "Invalid contact ID format"
          data: "Please provide a valid contact ID"
  '401':
    $ref: '../../../components/responses/UnauthorizedError.yaml'
  '404':
    $ref: '../../../components/responses/NotFoundError.yaml'
  '500':
    $ref: '../../../components/responses/ServerError.yaml'