tags:
  - Contacts
summary: Update a contact
operationId: updateContact
description: Update an existing contact. At least one field must be provided.
security:
  - bearerAuth: []
parameters:
  - $ref: '../../../components/parameters/contactId.yaml'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: "Updated Name"
          phoneNumber:
            type: string
            example: "+380501234568"
          email:
            type: string
            format: email
            example: "updated@example.com"
          isFavourite:
            type: boolean
            example: true
          contactType:
            type: string
            enum: [work, home, personal]
            example: "work"
          photo:
            type: string
            format: binary
            description: Contact photo (optional)
        minProperties: 1
responses:
  '200':
    description: Successfully updated contact
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: "Successfully patched a contact!"
            data:
              $ref: '../../../components/schemas/Contact.yaml'
  '400':
    $ref: '../../../components/responses/ValidationError.yaml'
  '401':
    $ref: '../../../components/responses/UnauthorizedError.yaml'
  '404':
    $ref: '../../../components/responses/NotFoundError.yaml'
  '500':
    $ref: '../../../components/responses/ServerError.yaml'